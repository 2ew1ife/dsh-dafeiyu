name: Test pull requests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; branch pushes are left alone so a
# merge to main is never killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # pnpm is installed in the next step, so there is no store to cache yet.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.21.0

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run JavaScript tests
        run: npm test

      - name: Verify published DSH 0.2 settings integration
        if: runner.os == 'Linux'
        run: |
          npm install --prefix .build/dsh-settings-smoke --ignore-scripts --no-audit --no-fund --no-package-lock @deepseek-ai/dsh@0.2.0-rc.2
          node scripts/test-dsh-settings.mjs .build/dsh-settings-smoke

      - name: Run Python tests
        run: python -m unittest discover -s runtime/tests -t .

  linux-helper:
    name: Build and smoke-test Linux x64 Helper
    # PyInstaller bakes the build host's glibc into the Helper, so the old
    # ubuntu-22.04 label was pinning the binary's baseline (glibc 2.35) on
    # purpose. Keep that baseline, but stop depending on a label GitHub
    # deprecated on 2026-09-17 and retires on 2027-04-17: run the job on a
    # supported runner and build inside an ubuntu:22.04 container.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 60

    steps:
      - name: Install system packages
        # Bare ubuntu images have no git, so this must run before checkout.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes \
            git ca-certificates binutils \
            xvfb libdbus-1-3 libegl1 libgl1 libfontconfig1 libglib2.0-0 \
            libsm6 libice6 libxrender1 libxi6 libxtst6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install bundled runtime dependencies
        run: npm install --ignore-scripts --no-package-lock --omit=dev

      - name: Install Python 3.11
        # setup-python cannot be used inside this container: it resolves to the
        # host tool cache build, which links against glibc 2.38 and will not
        # start on 22.04. deadsnakes gives us 3.11 built for jammy, so the
        # Helper's glibc baseline stays at 2.35.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install --yes software-properties-common
          add-apt-repository --yes ppa:deadsnakes/ppa
          apt-get update
          apt-get install --yes python3.11 python3.11-venv libpython3.11

      - name: Install Helper build dependencies
        # scripts/build-helper.sh picks .build/python-env up on its own.
        run: |
          python3.11 -m venv .build/python-env
          .build/python-env/bin/python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Test native card layout
        run: .build/python-env/bin/python -m unittest runtime.tests.test_helper_geometry -v

      - name: Build and visually smoke-test Linux Helper
        run: xvfb-run --auto-servernum npm run build:helper:linux

      - name: Verify Linux Helper survives npm packaging
        run: |
          archive=$(npm pack --silent)
          mkdir -p .build/package-check
          tar -xzf "$archive" -C .build/package-check
          test -x .build/package-check/package/runtime/bin/linux-x64/dsh-dafeiyu-helper
          node scripts/test-linked-package.mjs .build/package-check/package
          xvfb-run --auto-servernum node scripts/test-packaged-helper.mjs \
            --executable .build/package-check/package/runtime/bin/linux-x64/dsh-dafeiyu-helper

  macos-helper:
    name: Build and smoke-test macOS universal Helper
    # macos-15 is the arm64 image, so the x86_64 slice is cross-compiled and
    # only arch-checked; an Intel-only runtime regression would not be caught.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run Swift core tests
        run: swift test

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Set up Python
        # Without this the job silently used the image's python3 (3.14 on
        # macos-15) while the rest of CI pins 3.11.
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run JavaScript tests
        run: npm test

      - name: Run Python tests
        run: python3 -m unittest discover -s runtime/tests -t .

      - name: Build and visually smoke-test macOS Helper
        run: |
          npm run build:helper:darwin
          node scripts/test-packaged-helper.mjs

      - name: Verify universal architecture and ad-hoc signature
        run: |
          app=runtime/bin/darwin/dsh-dafeiyu-helper.app
          binary="$app/Contents/MacOS/dsh-dafeiyu-helper"
          lipo "$binary" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(node -p "require('./package.json').version")"

      - name: Verify macOS Helper survives npm packaging
        run: |
          archive=$(npm pack --silent)
          mkdir -p .build/package-check
          tar -xzf "$archive" -C .build/package-check
          app=.build/package-check/package/runtime/bin/darwin/dsh-dafeiyu-helper.app
          binary="$app/Contents/MacOS/dsh-dafeiyu-helper"
          test -x "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          node scripts/test-linked-package.mjs .build/package-check/package
          node scripts/test-packaged-helper.mjs --executable "$binary"
